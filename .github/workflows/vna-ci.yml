name: vna-ci

on:
  push:
    paths:
      - '.github/workflows/vna-ci.yml'
      - 'vna/**'
  pull_request:
    paths:
      - '.github/workflows/vna-ci.yml'
      - 'vna/**'

jobs:
  docs-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Markdown lint (vna docs)
        run: npx --yes markdownlint-cli@0.39.0 --config vna/docs/.markdownlint.json "vna/docs/**/*.md"

  build-and-test:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSYS2 (MinGW64)
        uses: msys2/setup-msys2@v2
        with:
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install VS Code extension deps
        working-directory: vna/tools/vscode-extension
        run: npm ci

      - name: Configure
        working-directory: vna
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          cmake --preset ninja-mingw

      - name: Build
        working-directory: vna
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          cmake --build --preset ninja-mingw

      - name: Easy tests
        working-directory: vna
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          .\scripts\run_easy_tests.ps1

      - name: Mainline strict gate
        working-directory: vna
        run: |
          $env:PATH = "C:\msys64\mingw64\bin;" + $env:PATH
          .\scripts\run_mainline_gate.ps1 -Profile strict -SkipBuild -SmokeTimeoutSec 20 -ResultJsonPath '.\build-grpc\ci-mainline-gate-{timestamp}.json'

      - name: Upload gate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vna-gate-reports
          path: |
            vna/build-grpc/smoke-matrix-gate-*.json
            vna/build-grpc/ci-mainline-gate-*.json